<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages & prix — Admin Cuisine Caritative</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo-icone.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 id="admin-title">Packages &amp; prix</h1>
        <p id="admin-subtitle" class="hint">Modifiez les prix, désactivez ou mettez en avant une formule.</p>
      </div>
      <button class="btn btn-gold btn-sm" id="add-pkg-btn">+ Nouvelle formule</button>
    </div>

    <div class="admin-card">
      <p class="card-sub">Les modifications sont reflétées immédiatement sur les pages Accueil, Packages et Commande (dans ce navigateur).</p>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th style="min-width:200px;">Nom</th><th>Étiquette</th><th>Prix (FCFA)</th><th>Bénéficiaires</th><th>Délai</th><th>Actif</th><th>Mis en avant</th><th></th></tr></thead>
          <tbody id="packages-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
adminGuard();
adminRenderShell('packages.html', 'Packages & prix', 'Modifiez les prix, désactivez ou mettez en avant une formule.');
adminRenderPackages();
document.getElementById('add-pkg-btn').addEventListener('click', adminAddPackage);
</script>
</body>
</html>
